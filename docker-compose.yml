services:
  web:
    build:
      context: .
    image: conference-final-manager:local
    restart: unless-stopped
    labels:
      com.conferencefinalmanager.host-data-dir: "${SMS_DATA_DIR:-./data}"
    expose:
      - "8000"
    environment:
      DJANGO_HOST: 0.0.0.0
      DJANGO_PORT: 8000
      SMS_DATABASE_PATH: /app/data/db.sqlite3
      SMS_MEDIA_ROOT: /app/data/media
      SMS_STATIC_ROOT: /app/staticfiles
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-local-dev-only-change-if-exposed}
      SMS_DEBUG: ${SMS_DEBUG:-0}
      SMS_ALLOWED_HOSTS: ${SMS_ALLOWED_HOSTS:-127.0.0.1,localhost,testserver}
      SMS_RUN_MIGRATIONS: ${SMS_RUN_MIGRATIONS:-1}
      SMS_WEB_WORKERS: ${SMS_WEB_WORKERS:-1}
      SMS_WEB_THREADS: ${SMS_WEB_THREADS:-4}
      SMS_WEB_TIMEOUT: ${SMS_WEB_TIMEOUT:-300}
    volumes:
      - .:/app
      - sms_data:/app/data
      - sms_static:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  proxy:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    labels:
      com.conferencefinalmanager.gateway-version: "1"
    ports:
      - "${SMS_BIND_HOST:-127.0.0.1}:${SMS_PORT:-8000}:80"
    environment:
      NGINX_ENVSUBST_FILTER: "^SMS_"
      SMS_PROXY_MAX_BODY_SIZE: ${SMS_PROXY_MAX_BODY_SIZE:-10g}
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/fallback.html:/srv/fallback/fallback.html:ro
      - ./docker/nginx/reload.sh:/srv/fallback/reload.sh:ro
      - ./submissions/static/submissions/brand/app-icon-512.png:/srv/fallback/app-icon.png:ro
      - sms_data:/app/data:ro
      - sms_static:/app/staticfiles:ro
      - sms_gateway_state:/srv/fallback-state
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/__sms_gateway/ping
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  sms_data:
  sms_static:
  sms_gateway_state:
