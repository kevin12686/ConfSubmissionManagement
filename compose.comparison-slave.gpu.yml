services:
  comparison-slave:
    build:
      target: gpu
    image: cfm-comparison-slave:gpu
    environment:
      CFM_OCR_BACKEND: cuda
      CFM_RAPIDOCR_PAGES: ${CFM_RAPIDOCR_PAGES:-4}
      CFM_GPU_MODEL_IDLE_SECONDS: ${CFM_GPU_MODEL_IDLE_SECONDS:-1800}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${CFM_SLAVE_GPU_DEVICE:-0}"]
              capabilities: [gpu]
